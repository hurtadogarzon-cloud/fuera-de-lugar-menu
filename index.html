
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuera de Lugar | Menú Digital</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <header class="encabezado">
        <div class="logo">
            <img src="static/img/logo_escudo_Rosado_Sin_Fondo.png" alt="Logo Fuera de Lugar">
        </div>
        <p>MENÚ DIGITAL</p>
    </header>

    <nav class="categorias" id="categorias">   
        <button class="categoria activa" data-categoria="Hamburguesas">Hamburguesas</button>
        <button class="categoria" data-categoria="Parrilla">Parrilla</button>
        <button class="categoria" data-categoria="Alitas">Alitas</button>
        <button class="categoria" data-categoria="Mazorcadas">Mazorcadas</button>
        <button class="categoria" data-categoria="Perros calientes">Perros calientes</button>
        <button class="categoria" data-categoria="Salchipapas">Salchipapas</button>
        <button class="categoria" data-categoria="Menú infantil">Menú infantil</button>
        <button class="categoria" data-categoria="Entradas">Entradas</button>
        <button class="categoria" data-categoria="Bebidas">Bebidas</button>
        <button class="categoria" data-categoria="Adiciones">Adiciones</button>
    </nav>

    <main class="contenido">
        <div class="titulo-seccion">
            <span class="linea"></span>
            <h1 id="titulo-categoria">ENTRADAS</h1>
            <span class="linea"></span>
        </div>

        <section class="productos" id="productos"></section>
    </main>

    <footer>
        <p>FUERA DE LUGAR</p>
        <span>BUEN SABOR. JUEGO LIMPIO.</span>
    </footer>

    <script src="static/script.js"></script>
</body>
</html>
